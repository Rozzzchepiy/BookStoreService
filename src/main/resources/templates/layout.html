<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="headerFiles">
    <meta charset="UTF-8">
    <title>Book Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand" href="/books">BookStore</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/books">Книги</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('CLIENT')">
                    <a class="nav-link" href="/cart">Кошик</a>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('EMPLOYEE', 'ADMIN')">
                    <a class="nav-link text-warning" href="/books/add">Додати книгу</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('EMPLOYEE', 'ADMIN')">
                    <a class="nav-link" href="/clients">Клієнти</a>
                </li>
                <li sec:authorize="hasRole('EMPLOYEE')">
                    <a class="nav-link" href="/orders/employee/my">Мої замовлення</a>
                </li>

                <li sec:authorize="hasRole('EMPLOYEE')">
                    <a class="nav-link" href="/orders/available">Нові замовлення</a>
                </li>

                <li sec:authorize="hasRole('CLIENT')">
                    <a class="nav-link" href="/orders/client/my">Мої замовлення</a>
                </li>

                <li sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/orders/admin/all">Всі замовлення</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/employees">Працівники</a>
                </li>
            </ul>

            <div class="d-flex">
                <div sec:authorize="!isAuthenticated()">
                    <a href="/login" class="btn btn-outline-light me-2">Вхід</a>
                    <a href="/client/register" class="btn btn-warning">Реєстрація</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <span sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/profile">Мій профіль</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item text-danger">Вихід</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
        <p class="mb-0">
            &copy; 2026 BookStore Project. All rights reserved.
            <br>
            <small class="text-white-50">Designed by Yurii Rozchepii</small>
        </p>
    </div>
</footer>

</body>
</html>
