<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.title}">Помилка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">

<div class="text-center">
    <h1 class="display-1 fw-bold text-danger" th:text="${status}">404</h1>

    <p class="lead mb-4" th:text="${error}">Опис помилки...</p>

    <a th:href="@{/}" class="btn btn-primary" th:text="#{error.home_btn}">На головну</a>
</div>

</body>
</html>
