<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 th:text="${employee.id == null} ? #{employee.form.new_title} : #{employee.form.edit_title}">Форма</h3>
                </div>
                <div class="card-body">

                    <form th:action="${(employee.id == null) ? '/employees/add' : '/employees/edit/' + employee.id}"
                          th:object="${employee}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label" th:text="#{employee.form.label.name}">Ім'я та Прізвище</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label" th:text="#{employee.form.label.email}">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label" th:text="#{employee.form.label.phone}">Телефон</label>
                            <input type="text" class="form-control" id="phone" th:field="*{phone}" placeholder="+380..."
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="birthDate" class="form-label" th:text="#{employee.form.label.birth}">Дата народження</label>
                            <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}"
                                   th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label" th:text="#{employee.form.label.password}">Пароль</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">

                            <small class="text-muted" th:if="${employee.id != null}" th:text="#{employee.form.hint.password}">Новий пароль...</small>

                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/employees" class="btn btn-secondary" th:text="#{employee.form.btn.cancel}">Скасувати</a>
                            <button type="submit" class="btn btn-success" th:text="#{employee.form.btn.save}">Зберегти</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
