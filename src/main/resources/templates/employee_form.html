<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 th:text="${employee.id == null ? 'Новий працівник' : 'Редагування працівника'}">Форма</h3>
                </div>
                <div class="card-body">

                    <form th:action="${employee.id == null} ? @{/employees/add} : @{/employees/edit/{id}(id=${employee.id})}"
                          th:object="${employee}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Ім'я та Прізвище</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Телефон</label>
                            <input type="text" class="form-control" id="phone" th:field="*{phone}" placeholder="+380..." required>
                            <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="birthDate" class="form-label">Дата народження</label>
                            <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}"
                                   th:required="${employee.id == null}">
                            <small class="text-muted" th:if="${employee.id != null}">Залиште пустим, якщо не хочете змінювати</small>
                            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/employees" class="btn btn-secondary">Скасувати</a>
                            <button type="submit" class="btn btn-success">Зберегти</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
