<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: headerFiles}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="text-center mb-4">Реєстрація Клієнта</h3>

            <form th:action="@{/client/register}" th:object="${client}" method="post">
                <div class="mb-3">
                    <label>Ім'я</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Пароль</label>
                    <input type="password" th:field="*{password}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Початковий баланс</label>
                    <input type="number" th:field="*{balance}" class="form-control" value="0">
                </div>

                <button type="submit" class="btn btn-success w-100">Створити акаунт</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
