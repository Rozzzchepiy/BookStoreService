<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="text-center mb-4" th:text="#{register.title}">Реєстрація Клієнта</h3>

            <form th:action="@{/client/register}" th:object="${client}" method="post">

                <div class="mb-3">
                    <label th:text="#{register.label.name}">Ім'я</label>
                    <input type="text" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        Помилка імені
                    </div>
                </div>

                <div class="mb-3">
                    <label th:text="#{register.label.email}">Email</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                        Помилка email
                    </div>
                </div>

                <div class="mb-3">
                    <label th:text="#{register.label.password}">Пароль</label>

                    <input type="password" th:field="*{password}" class="form-control"
                           th:placeholder="#{register.placeholder.password}"
                           placeholder="Ваш пароль"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">

                    <small class="form-text text-muted" th:text="#{register.hint.password}">
                        Вимоги: 6-25 символів...
                    </small>

                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                        Помилка пароля
                    </div>
                </div>

                <div class="mb-3">
                    <label th:text="#{register.label.balance}">Початковий баланс</label>
                    <input type="number" step="0.01" th:field="*{balance}" class="form-control"
                           th:classappend="${#fields.hasErrors('balance')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback" th:if="${#fields.hasErrors('balance')}" th:errors="*{balance}">
                        Помилка балансу
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100" th:text="#{register.btn.submit}">Створити акаунт</button>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
