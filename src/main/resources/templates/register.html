<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="text-center mb-4">Реєстрація Клієнта</h3>

            <form th:action="@{/client/register}" th:object="${client}" method="post">
                <div class="mb-3">
                    <label>Ім'я</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Пароль</label>
                    <input type="password" th:field="*{password}" class="form-control"
                           placeholder="Мінімум 6 символів"
                           required
                           minlength="6"
                           maxlength="25"
                           oninput="this.setCustomValidity('')"
                           oninvalid="this.setCustomValidity(this.value.length < 6 ? 'Пароль занадто короткий (мінімум 6)!' : 'Будь ласка, заповніть це поле!')">

                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label>Початковий баланс</label>
                    <input type="number" th:field="*{balance}" class="form-control" value="0" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Створити акаунт</button>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
