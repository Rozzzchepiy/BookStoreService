<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Список працівників</h2>
        <a href="/employees/add" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Додати працівника
        </a>
    </div>

    <div class="table-responsive shadow-sm">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Ім'я</th>
                <th>Email</th>
                <th>Телефон</th>
                <th>Дата народження</th>
                <th>Дії</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${employees}">
                <td th:text="${e.id}">1</td>
                <td th:text="${e.name}">Ivan</td>
                <td th:text="${e.email}">ivan@mail.com</td>
                <td th:text="${e.phone}">+380...</td>
                <td th:text="${e.birthDate}">2000-01-01</td>
                <td>
                    <a th:href="@{/employees/edit/{id}(id=${e.id})}" class="btn btn-sm btn-primary">
                        Редагувати
                    </a>

                    <form th:action="@{/employees/delete/{id}(id=${e.id})}" method="post" style="display:inline;"
                          onsubmit="return confirm('Ви впевнені, що хочете звільнити цього працівника?');">
                        <button type="submit" class="btn btn-sm btn-danger">Видалити</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
