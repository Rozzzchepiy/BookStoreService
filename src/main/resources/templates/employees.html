<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-4 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 th:text="#{employees.title}">Список працівників</h2>

        <div class="d-flex gap-2">
            <form class="d-flex" role="search" th:action="@{/employees}" method="get">
                <input class="form-control me-2" type="search" name="keyword"
                       th:value="${keyword}" th:placeholder="#{employees.search_placeholder}" aria-label="Search">
                <button class="btn btn-outline-primary" type="submit" th:text="#{common.btn.search}">Пошук</button>
                <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/employees}"
                   class="btn btn-outline-secondary ms-2" th:text="#{common.btn.reset}">Скинути</a>
            </form>

            <a href="/employees/add" class="btn btn-success text-nowrap">
                <i class="bi bi-plus-circle"></i> <span th:text="#{employees.btn.add}">Додати</span>
            </a>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="#{${error}}">Текст помилки</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}">Операція успішна</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="table-responsive shadow-sm mt-3">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th th:text="#{employees.col.id}">ID</th>
                <th th:text="#{employees.col.name}">Ім'я</th>
                <th th:text="#{employees.col.email}">Email</th>
                <th th:text="#{employees.col.phone}">Телефон</th>
                <th th:text="#{employees.col.birth}">Дата народження</th>
                <th th:text="#{employees.col.actions}">Дії</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${employees.content}">
                <td th:text="${e.id}">1</td>
                <td th:text="${e.name}">Ivan</td>
                <td th:text="${e.email}">ivan@mail.com</td>
                <td th:text="${e.phone}">+380...</td>
                <td th:text="${e.birthDate}">2000-01-01</td>
                <td>
                    <div class="d-flex gap-1">
                        <a th:href="@{/employees/edit/{id}(id=${e.id})}" class="btn btn-sm btn-primary" th:text="#{employees.btn.edit}">
                            Редагувати
                        </a>

                        <form th:action="@{/employees/delete/{id}(id=${e.id}, page=${employees.number}, keyword=${keyword})}"
                              method="post"
                              style="display:inline;"
                              th:attr="onsubmit='return confirm(\'' + #{employees.confirm_delete} + '\');'">
                            <button type="submit" class="btn btn-sm btn-danger" th:text="#{employees.btn.delete}">Видалити</button>
                        </form>

                        <a th:href="@{/employees/{id}(id=${e.id})}" class="btn btn-sm btn-info text-white" th:text="#{employees.btn.details}">
                            Деталі
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${employees.empty}">
                <td colspan="6" class="text-center" th:text="#{employees.list.empty}">Працівників не знайдено</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav aria-label="Page navigation" th:if="${employees.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${employees.first} ? 'disabled'">
                <a class="page-link" th:href="@{/employees(page=${employees.number - 1}, keyword=${keyword})}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, employees.totalPages - 1)}"
                th:classappend="${i == employees.number} ? 'active'">
                <a class="page-link" th:href="@{/employees(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${employees.last} ? 'disabled'">
                <a class="page-link" th:href="@{/employees(page=${employees.number + 1}, keyword=${keyword})}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
