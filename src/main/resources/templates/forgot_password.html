<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}">
  <title th:text="#{forgot_password.title}">Відновлення пароля</title>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0 text-center" th:text="#{forgot_password.title}">Відновлення пароля</h4>
        </div>
        <div class="card-body p-4">

          <div th:if="${param.status != null and param.status[0] == 'sent'}"
               class="alert alert-success text-center">
            <i class="bi bi-check-circle-fill"></i><br>
            <span th:text="#{forgot_password.success_msg}">Якщо цей email зареєстрований...</span>
          </div>

          <div th:if="${error == 'invalid_token'}" class="alert alert-danger text-center">
            <i class="bi bi-exclamation-triangle"></i><br>
            <span th:text="#{forgot_password.error.invalid_token}">Посилання недійсне або застаріло.</span>
          </div>

          <p class="text-muted text-center mb-4" th:text="#{forgot_password.instructions}">
            Введіть свою електронну пошту...
          </p>

          <form th:action="@{/forgot-password}" method="post">
            <div class="mb-3">
              <label for="email" class="form-label" th:text="#{register.label.email}">Email адреса</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email"
                       th:placeholder="#{forgot_password.placeholder.email}" required autofocus>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary" th:text="#{forgot_password.btn.submit}">Відновити пароль</button>
              <a href="/login" class="btn btn-outline-secondary" th:text="#{forgot_password.btn.back}">Повернутися до входу</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
