<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-4 flex-grow-1">
  <h2>Список клієнтів</h2>

  <div class="table-responsive mt-3">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Ім'я</th>
        <th>Email</th>
        <th>Баланс</th>
        <th>Дії</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="c : ${clients}">
        <td th:text="${c.id}">1</td>
        <td th:text="${c.name}">Name</td>
        <td th:text="${c.email}">email</td>
        <td th:text="${c.balance}">0.00</td>
        <td>
          <a th:href="@{/clients/{id}(id=${c.id})}" class="btn btn-outline-primary btn-sm">Деталі</a>

          <form th:action="@{/clients/delete/{id}(id=${c.id})}" method="post" style="display:inline;"
                onsubmit="return confirm('Видалити цього клієнта?');">
            <button type="submit" class="btn btn-sm btn-danger">Видалити</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
