<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-4 flex-grow-1">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 th:text="#{clients.title}">Список клієнтів</h2>

    <form class="d-flex" role="search" th:action="@{/clients}" method="get">
      <input class="form-control me-2" type="search" name="keyword"
             th:value="${keyword}" th:placeholder="#{clients.search_placeholder}" aria-label="Search">

      <button class="btn btn-outline-success" type="submit" th:text="#{common.btn.search}">Пошук</button>

      <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/clients}"
         class="btn btn-outline-secondary ms-2" th:text="#{common.btn.reset}">Скинути</a>
    </form>
  </div>

  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span th:text="#{${error}}">Текст помилки</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span th:text="${success}">Успіх</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <div class="table-responsive mt-3">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
      <tr>
        <th th:text="#{clients.col.id}">ID</th>
        <th th:text="#{clients.col.name}">Ім'я</th>
        <th th:text="#{clients.col.email}">Email</th>
        <th th:text="#{clients.col.balance}">Баланс</th>
        <th th:text="#{clients.col.status}">Статус</th>
        <th th:text="#{clients.col.actions}">Дії</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="c : ${clients.content}">
        <td th:text="${c.id}">1</td>
        <td th:text="${c.name}">Name</td>
        <td th:text="${c.email}">email</td>
        <td th:text="${c.balance}">0.00</td>
        <td>
          <span th:if="${!c.blocked}" class="badge bg-success" th:text="#{client.status.active}">Активний</span>
          <span th:if="${c.blocked}" class="badge bg-danger" th:text="#{client.status.blocked}">Заблокований</span>
        </td>
        <td>
          <div class="d-flex gap-1">
            <a th:href="@{/clients/{id}(id=${c.id})}" class="btn btn-outline-primary btn-sm" th:text="#{client.btn.details}">Деталі</a>

            <form th:if="${!c.blocked}" th:action="@{/clients/{id}/block(id=${c.id})}" method="post">
              <button type="submit" class="btn btn-sm btn-warning" th:text="#{client.btn.block}">Блок</button>
            </form>

            <form th:if="${c.blocked}" th:action="@{/clients/{id}/unblock(id=${c.id})}" method="post">
              <button type="submit" class="btn btn-sm btn-success" th:text="#{client.btn.unblock}">Розблок</button>
            </form>

            <form th:action="@{/clients/delete/{id}(id=${c.id}, page=${clients.number}, keyword=${keyword})}"
                  method="post"
                  th:attr="onsubmit='return confirm(\'' + #{client.confirm_delete} + '\');'">
              <button type="submit" class="btn btn-sm btn-danger" th:text="#{client.btn.delete}">Видалити</button>
            </form>
          </div>
        </td>
      </tr>
      <tr th:if="${clients.empty}">
        <td colspan="6" class="text-center" th:text="#{clients.list.empty}">Клієнтів не знайдено</td>
      </tr>
      </tbody>
    </table>
  </div>

  <nav aria-label="Page navigation" th:if="${clients.totalPages > 1}">
    <ul class="pagination justify-content-center">

      <li class="page-item" th:classappend="${clients.first} ? 'disabled'">
        <a class="page-link" th:href="@{/clients(page=${clients.number - 1}, keyword=${keyword})}" aria-label="Previous">
          <span aria-hidden="true">&laquo;</span>
        </a>
      </li>

      <li class="page-item" th:each="i : ${#numbers.sequence(0, clients.totalPages - 1)}"
          th:classappend="${i == clients.number} ? 'active'">
        <a class="page-link" th:href="@{/clients(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
      </li>

      <li class="page-item" th:classappend="${clients.last} ? 'disabled'">
        <a class="page-link" th:href="@{/clients(page=${clients.number + 1}, keyword=${keyword})}" aria-label="Next">
          <span aria-hidden="true">&raquo;</span>
        </a>
      </li>
    </ul>
  </nav>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
