<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}">
  <title th:text="#{topup.title}">Поповнення балансу</title>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-success">
        <div class="card-header bg-success text-white text-center">
          <h3 th:text="#{topup.header}">Поповнення рахунку</h3>
        </div>
        <div class="card-body p-4">

          <p class="text-center text-muted mb-4" th:text="#{topup.desc}">
            Введіть суму, яку бажаєте зарахувати на свій баланс.
          </p>

          <form th:action="@{/profile/topup}" method="post">

            <div th:if="${error}" class="alert alert-danger">
              <span th:text="#{${error}}">Помилка</span>
            </div>

            <div class="mb-4">
              <label for="amount" class="form-label fw-bold" th:text="#{topup.label_amount}">Сума поповнення (грн)</label>
              <div class="input-group">
                <span class="input-group-text">₴</span>
                <input type="number"
                       id="amount"
                       name="amount"
                       class="form-control form-control-lg"
                       th:placeholder="#{topup.placeholder_amount}"
                       placeholder="0.00"
                       step="0.01">
              </div>
              <div class="form-text" th:text="#{topup.help_min}">Мінімальна сума поповнення — 1 грн.</div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success btn-lg" th:text="#{topup.btn_submit}">
                Поповнити баланс
              </button>
              <a href="/profile" class="btn btn-outline-secondary" th:text="#{topup.btn_cancel}">Скасувати</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
