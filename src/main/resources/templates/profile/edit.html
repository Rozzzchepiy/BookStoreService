<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-warning">
                <div class="card-header bg-warning text-dark">
                    <h3 th:text="#{profile.edit.title}">Редагування профілю</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/profile/edit}" th:object="${client}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label" th:text="#{profile.edit.login_label}">Email (Логін)</label>
                            <input type="email" class="form-control" th:field="*{email}" required
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">

                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                Email error placeholder
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label" th:text="#{profile.edit.name_label}">Ім'я *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label" th:text="#{profile.edit.password_label}">Новий пароль *</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}"
                                   th:placeholder="#{profile.edit.password_placeholder}"
                                   placeholder="Мінімум 6 символів"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="balance" class="form-label" th:text="#{profile.edit.balance_label}">Баланс</label>
                            <input type="number" step="0.01" class="form-control" id="balance" th:field="*{balance}" readonly>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success" th:text="#{profile.edit.btn_save}">Зберегти зміни</button>
                            <a href="/profile" class="btn btn-secondary" th:text="#{profile.edit.btn_cancel}">Скасувати</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
