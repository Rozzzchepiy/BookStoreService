<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-warning">
                <div class="card-header bg-warning text-dark">
                    <h3>Редагування книги</h3>
                </div>
                <div class="card-body">

                    <form th:action="@{/books/edit/{id}(id=${book.id})}" th:object="${book}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Назва книги *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="author" class="form-label">Автор *</label>
                                <input type="text" class="form-control" id="author" th:field="*{author}" required
                                       th:classappend="${#fields.hasErrors('author')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:errors="*{author}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="genre" class="form-label">Жанр *</label>
                                <input type="text" class="form-control" id="genre" th:field="*{genre}" required
                                       th:classappend="${#fields.hasErrors('genre')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:errors="*{genre}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label">Ціна *</label>
                                <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="pages" class="form-label">Кількість сторінок *</label>
                                <input type="number" class="form-control" id="pages" th:field="*{pages}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Вікова група *</label>
                                <select class="form-select" th:field="*{ageGroup}" required>
                                    <option th:each="group : ${T(com.epam.rd.autocode.spring.project.model.enums.AgeGroup).values()}"
                                            th:value="${group}" th:text="${group}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Мова *</label>
                                <select class="form-select" th:field="*{language}" required>
                                    <option th:each="lang : ${T(com.epam.rd.autocode.spring.project.model.enums.Language).values()}"
                                            th:value="${lang}" th:text="${lang}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Дата публікації *</label>
                                <input type="date" class="form-control" th:field="*{publicationDate}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="characteristics" class="form-label">Характеристики *</label>
                            <input type="text" class="form-control" id="characteristics" th:field="*{characteristics}" required
                                   th:classappend="${#fields.hasErrors('characteristics')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{characteristics}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Опис *</label>
                            <textarea class="form-control" id="description" rows="4" th:field="*{description}" required
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning">Оновити книгу</button>
                            <a href="/books" class="btn btn-secondary">Скасувати</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
