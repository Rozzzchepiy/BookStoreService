<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-warning">
                <div class="card-header bg-warning text-dark">
                    <h3 th:text="#{form.edit_title}">Редагування книги</h3>
                </div>
                <div class="card-body">

                    <form th:action="@{/books/edit/{id}(id=${book.id})}" th:object="${book}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label" th:text="#{form.label.name}">Назва книги *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="author" class="form-label" th:text="#{form.label.author}">Автор *</label>
                                <input type="text" class="form-control" id="author" th:field="*{author}"
                                       th:classappend="${#fields.hasErrors('author')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:errors="*{author}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="genre" class="form-label" th:text="#{form.label.genre}">Жанр *</label>
                                <input type="text" class="form-control" id="genre" th:field="*{genre}"
                                       th:classappend="${#fields.hasErrors('genre')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:errors="*{genre}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label" th:text="#{form.label.price}">Ціна *</label>
                                <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="pages" class="form-label" th:text="#{form.label.pages}">Кількість сторінок *</label>
                                <input type="number" class="form-control" id="pages" th:field="*{pages}"
                                       th:classappend="${#fields.hasErrors('pages')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:errors="*{pages}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label" th:text="#{form.label.age}">Вікова група *</label>
                                <select class="form-select" th:field="*{ageGroup}"
                                        th:classappend="${#fields.hasErrors('ageGroup')} ? 'is-invalid' : ''">
                                    <option th:each="group : ${T(com.epam.rd.autocode.spring.project.model.enums.AgeGroup).values()}"
                                            th:value="${group}" th:text="${group}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{ageGroup}"></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label" th:text="#{form.label.lang}">Мова *</label>
                                <select class="form-select" th:field="*{language}"
                                        th:classappend="${#fields.hasErrors('language')} ? 'is-invalid' : ''">
                                    <option th:each="lang : ${T(com.epam.rd.autocode.spring.project.model.enums.Language).values()}"
                                            th:value="${lang}" th:text="${lang}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{language}"></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label" th:text="#{form.label.date}">Дата публікації *</label>
                                <input type="date" class="form-control" th:field="*{publicationDate}"
                                       th:classappend="${#fields.hasErrors('publicationDate')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:errors="*{publicationDate}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="characteristics" class="form-label" th:text="#{form.label.chars}">Характеристики *</label>
                            <input type="text" class="form-control" id="characteristics" th:field="*{characteristics}"
                                   th:classappend="${#fields.hasErrors('characteristics')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{characteristics}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label" th:text="#{form.label.desc}">Опис *</label>
                            <textarea class="form-control" id="description" rows="4" th:field="*{description}"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning" th:text="#{form.btn.update}">Оновити книгу</button>
                            <a href="/books" class="btn btn-secondary" th:text="#{form.btn.cancel}">Скасувати</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
