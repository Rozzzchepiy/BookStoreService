<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments :: headerFiles}"></head>

<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Список доступних книг</h2>

    <a sec:authorize="hasRole('EMPLOYEE')" href="/books/add" class="btn btn-success">
      + Додати книгу
    </a>
  </div>

  <div th:if="${myBooks.empty}" class="alert alert-info">
    Книг поки немає в наявності.
  </div>

  <table class="table table-striped table-hover table-bordered" th:if="${!myBooks.empty}">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Назва</th>
      <th>Автор</th>
      <th>Жанр</th>
      <th>Мова</th>
      <th>Ціна</th>
      <th class="text-center">Дії</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${myBooks}">
      <td th:text="${book.id}">1</td>

      <td class="fw-bold" th:text="${book.name}">Java Book</td>

      <td th:text="${book.author}">Author</td>
      <td th:text="${book.genre}">Genre</td>
      <td th:text="${book.language}">ENG</td>

      <td th:text="${book.price} + ' ₴'" class="fw-bold text-success">500 ₴</td>

      <td class="text-center" style="min-width: 200px;">
        <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-primary btn-sm">
          ℹ️ Інфо
        </a>

        <span sec:authorize="hasRole('EMPLOYEE')">
                    <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning btn-sm">
                        ✏️
                    </a>
                    <a th:href="@{/books/delete/{id}(id=${book.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Ви впевнені, що хочете видалити цю книгу?');">
                        🗑️
                    </a>
                </span>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
