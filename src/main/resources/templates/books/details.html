<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="#{${errorMessage}}">Помилка видалення</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="row">
        <div class="col-md-8">
            <h1 th:text="${book.name}">Назва книги</h1>
            <h4 class="text-muted mb-3" th:text="#{book.author_prefix} + ' ' + ${book.author}">Автор</h4>

            <h2 class="text-success my-3" th:text="${book.price} + ' ' + #{book.price_currency}">Ціна</h2>

            <p class="lead" th:text="${book.description}">Опис книги...</p>

            <table class="table table-striped mt-4">
                <tbody>
                <tr>
                    <th scope="row" th:text="#{book.genre}">Жанр</th>
                    <td th:text="${book.genre}"></td>
                </tr>
                <tr>
                    <th scope="row" th:text="#{book.age_group}">Вікова категорія</th>
                    <td th:text="${book.ageGroup}"></td>
                </tr>
                <tr>
                    <th scope="row" th:text="#{book.language}">Мова</th>
                    <td th:text="${book.language}"></td>
                </tr>
                <tr>
                    <th scope="row" th:text="#{book.pages}">Кількість сторінок</th>
                    <td th:text="${book.pages}"></td>
                </tr>
                <tr>
                    <th scope="row" th:text="#{book.pub_date}">Дата публікації</th>
                    <td th:text="${book.publicationDate}"></td>
                </tr>
                <tr>
                    <th scope="row" th:text="#{book.characteristics}">Характеристики</th>
                    <td th:text="${book.characteristics}"></td>
                </tr>
                </tbody>
            </table>

            <div class="mt-4 d-flex align-items-center flex-wrap gap-2">
                <a href="/books" class="btn btn-secondary" th:text="#{book.back_btn}">← Назад до списку</a>

                <div sec:authorize="hasAnyRole('EMPLOYEE', 'ADMIN')" class="d-flex gap-2">

                    <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning" th:text="#{book.edit_btn}">
                        Редагувати
                    </a>

                    <form th:action="@{/books/delete/{id}(id=${book.id})}"
                           method="post"
                           th:attr="onsubmit='return confirm(\'' + #{book.confirm_delete} + '\');'">
                        <button type="submit" class="btn btn-danger">
                            <span th:text="#{book.delete_btn}">Delete</span>
                        </button>
                    </form>

                </div>

                <div sec:authorize="hasRole('CLIENT')">
                    <div th:if="${isBookInCart}">
                        <a href="/orders/basket" class="btn btn-primary" th:text="#{book.go_to_cart_btn}">
                            Перейти до кошика
                        </a>
                        <span class="text-success small ms-2 fw-bold" th:text="#{book.in_cart_msg}">
                            Вже у кошику
                        </span>
                    </div>

                    <form th:unless="${isBookInCart}"
                          th:action="@{/orders/basket/add}" method="post" class="d-flex align-items-center gap-2">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <div>
                            <label for="quantity" class="visually-hidden" th:text="#{book.quantity_label}">Кількість:</label>
                            <div class="input-group">
                                <span class="input-group-text" th:text="#{book.quantity_label}">К-сть:</span>
                                <input type="number" id="quantity" name="quantity"
                                       value="1" min="1" class="form-control" style="width: 80px;">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success" th:text="#{book.add_to_cart_btn}">
                            Додати в кошик
                        </button>
                    </form>
                </div>

                <div sec:authorize="isAnonymous()"> <div class="d-flex align-items-center gap-2">
                    <div class="input-group" style="width: 130px; opacity: 0.7;">
                        <span class="input-group-text" th:text="#{book.quantity_label}">К-сть:</span>
                        <input type="number" value="1" disabled class="form-control">
                    </div>

                    <a th:href="@{/books/{id}/buy-intent(id=${book.id})}"
                       class="btn btn-success">
                        <i class="bi bi-cart-plus"></i> <span th:text="#{book.add_to_cart_btn}">Купити</span>
                    </a>
                </div>
                    <div class="text-muted small mt-1">
                        * <span th:text="#{login.required_hint} ?: 'Необхідно увійти'">Потрібен вхід</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
