<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">

    <div th:if="${param.msg}" class="alert alert-success alert-dismissible fade show col-md-6 mx-auto" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="#{${param.msg[0]}}">Успішна операція</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show col-md-6 mx-auto" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="#{${param.error[0]}}">Помилка</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h3 class="mb-0 fs-4">
                        <i class="bi bi-person-circle me-2"></i><span th:text="#{profile.title}">Мій профіль</span>
                    </h3>
                </div>

                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <img th:src="@{'https://ui-avatars.com/api/?name=' + ${client.name} + '&background=random&size=128'}"
                             class="rounded-circle shadow-sm" width="100" alt="Avatar">
                        <h4 class="mt-3 mb-0 fw-bold" th:text="${client.name}">User Name</h4>
                        <p class="text-muted" th:text="${client.email}">user@example.com</p>
                    </div>

                    <ul class="list-group list-group-flush rounded-3">
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <strong th:text="#{profile.balance}">Баланс:</strong>
                            <div class="d-flex align-items-center gap-2">
                                <span class="fs-5 text-success fw-bold" th:text="${client.balance} + ' ₴'">0.00 ₴</span>

                                <a href="/profile/topup" class="btn btn-sm btn-outline-success" title="Поповнити">
                                    <i class="bi bi-plus-lg">+</i>
                                </a>
                            </div>
                        </li>

                    </ul>

                    <div class="d-grid gap-2 mt-4">

                        <a href="/profile/edit" class="btn btn-warning mt-2">
                            <i class="bi bi-pencil-fill me-1"></i> <span th:text="#{profile.btn.edit}">Редагувати</span>
                        </a>

                        <a href="/books" class="btn btn-outline-secondary mt-2">
                            <i class="bi bi-book me-1"></i> <span th:text="#{profile.btn.books}">До каталогу</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
