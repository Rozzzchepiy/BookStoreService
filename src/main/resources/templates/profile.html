<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Мій профіль</h3>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <img src="https://ui-avatars.com/api/?name=User&background=random" class="rounded-circle" width="100" alt="Avatar">
                    </div>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <strong>Ім'я:</strong> <span th:text="${client.name}">Name</span>
                        </li>
                        <li class="list-group-item">
                            <strong>Email:</strong> <span th:text="${client.email}">email@example.com</span>
                        </li>
                        <li class="list-group-item">
                            <strong>Баланс:</strong> <span class="badge bg-success" th:text="${client.balance} + ' грн.'">0.00</span>
                        </li>
                    </ul>

                    <div class="d-grid gap-2 mt-4">
                        <a href="/profile/edit" class="btn btn-warning">Редагувати дані</a>
                        <a href="/books" class="btn btn-outline-secondary">До списку книг</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
