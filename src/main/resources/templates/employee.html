<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">
                        <i class="bi bi-person-badge"></i> <span th:text="#{employee.details.title}">Інформація про працівника</span>
                    </h3>
                </div>

                <div class="card-body">
                    <dl class="row fs-5">
                        <dt class="col-sm-4 text-muted" th:text="#{employee.id}">ID працівника:</dt>
                        <dd class="col-sm-8" th:text="${employee.id}">1</dd>

                        <dt class="col-sm-4 text-muted" th:text="#{employee.name}">ПІБ:</dt>
                        <dd class="col-sm-8 fw-bold" th:text="${employee.name}">Ім'я</dd>

                        <dt class="col-sm-4 text-muted" th:text="#{employee.email}">Email:</dt>
                        <dd class="col-sm-8" th:text="${employee.email}">employee@mail.com</dd>

                        <dt class="col-sm-4 text-muted" th:text="#{employee.phone}">Телефон:</dt>
                        <dd class="col-sm-8" th:text="${employee.phone} ?: #{employee.phone_empty}">+380...</dd>

                        <dt class="col-sm-4 text-muted" th:text="#{employee.birthDate}">День народження:</dt>
                        <dd class="col-sm-8" th:text="${employee.birthDate} ?: #{employee.birthDate_empty}">09/11/2005</dd>
                    </dl>

                    <hr>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="/employees" class="btn btn-secondary" th:text="#{employee.btn_back}">
                            ← Назад до списку
                        </a>

                        <a th:href="@{/orders/employee/{id}(id=${employee.id})}" class="btn btn-info text-white" th:text="#{employee.btn_orders}">
                            Переглянути закріплені замовлення
                        </a>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
