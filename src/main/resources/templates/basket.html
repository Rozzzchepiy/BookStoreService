<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5, flex-grow-1">
  <h2>Ваш кошик</h2>

  <div th:if="${param.error}" class="alert alert-danger">
    <span th:if="${param.error[0] == 'empty'}">Кошик порожній!</span>
    <span th:unless="${param.error[0] == 'empty'}" th:text="${param.error}">Помилка</span>
  </div>

  <div th:if="${items.isEmpty()}" class="alert alert-info">
    Ваш кошик порожній. <a href="/books">Перейти до покупок</a>
  </div>

  <div th:if="${!items.isEmpty()}">
    <table class="table align-middle">
      <thead class="table-light">
      <tr>
        <th>Назва книги</th>
        <th>Ціна</th>
        <th class="text-center">Кількість</th>
        <th>Сума</th>
        <th>Дії</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${items}">
        <td th:text="${item.bookName}">Назва</td>
        <td th:text="${item.price} + ' грн'">Ціна</td>

        <td class="text-center">
          <div class="btn-group" role="group">

            <form th:action="@{/orders/basket/update}" method="post" style="display:inline;">
              <input type="hidden" name="bookId" th:value="${item.bookId}">
              <input type="hidden" name="quantity" th:value="${item.quantity - 1}">
              <button type="submit" class="btn btn-outline-secondary btn-sm">-</button>
            </form>

            <span class="btn btn-light btn-sm disabled text-dark border"
                  style="opacity: 1; width: 40px;" th:text="${item.quantity}">1</span>

            <form th:action="@{/orders/basket/update}" method="post" style="display:inline;">
              <input type="hidden" name="bookId" th:value="${item.bookId}">
              <input type="hidden" name="quantity" th:value="${item.quantity + 1}">
              <button type="submit" class="btn btn-outline-secondary btn-sm">+</button>
            </form>
          </div>
        </td>

        <td th:text="${item.price * item.quantity} + ' грн'">Сума</td>

        <td>
          <form th:action="@{/orders/basket/remove}" method="post">
            <input type="hidden" name="bookId" th:value="${item.bookId}">
            <button type="submit" class="btn btn-danger btn-sm">Видалити</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

    <div class="d-flex justify-content-end align-items-center mt-4">
      <h4 class="me-4">Разом: <span class="text-success" th:text="${totalPrice} + ' грн'">0.00 грн</span></h4>

      <form th:action="@{/orders/create}" method="post">
        <button type="submit" class="btn btn-primary btn-lg">Оформити замовлення</button>
      </form>
    </div>

    <div class="mt-3">
      <a href="/books" class="btn btn-link">← Продовжити покупки</a>
    </div>
  </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
