<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">
                        <i class="bi bi-person-circle"></i> <span th:text="#{client.profile.title}">Профіль клієнта</span>
                    </h3>
                </div>

                <div class="card-body">
                    <dl class="row fs-5">
                        <dt class="col-sm-4 text-muted" th:text="#{client.id}">ID клієнта:</dt>
                        <dd class="col-sm-8" th:text="${client.id}">5</dd>

                        <dt class="col-sm-4 text-muted" th:text="#{client.name}">Ім'я:</dt>
                        <dd class="col-sm-8 fw-bold" th:text="${client.name}">Олена Петрівна</dd>

                        <dt class="col-sm-4 text-muted" th:text="#{client.email}">Email:</dt>
                        <dd class="col-sm-8" th:text="${client.email}">client@mail.com</dd>

                        <dt class="col-sm-4 text-muted" th:text="#{client.balance}">Поточний баланс:</dt>
                        <dd class="col-sm-8 text-success fw-bold" th:text="${client.balance} + ' ' + #{nav.currency}">1500.00 грн.</dd>

                        <dt class="col-sm-4 text-muted" th:text="#{clients.col.status}" >Статус акаунта:</dt>
                        <dd class="col-sm-8">
                            <span th:if="${!client.blocked}" class="badge bg-success" th:text="#{client.status.active}">Активний</span>
                            <span th:if="${client.blocked}" class="badge bg-danger" th:text="#{client.status.blocked}">Заблокований</span>
                        </dd>
                    </dl>

                    <hr>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <div>
                            <a href="/clients" class="btn btn-secondary" th:text="#{client.btn.back}">← Назад</a>

                            <form th:if="${!client.blocked}" th:action="@{/clients/{id}/block(id=${client.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-warning ms-2" th:text="#{client.btn.block}" >Заблокувати клієнта</button>
                            </form>

                            <form th:if="${client.blocked}" th:action="@{/clients/{id}/unblock(id=${client.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-success ms-2" th:text="#{client.btn.unblock}">Розблокувати клієнта</button>
                            </form>
                        </div>

                        <a th:href="@{/orders/client/{id}(id=${client.id})}" class="btn btn-primary" th:text="#{client.btn.history}">
                            Історія замовлень клієнта
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
