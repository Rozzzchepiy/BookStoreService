<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: headerFiles}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">
                        <i class="bi bi-person-circle"></i> Профіль клієнта
                    </h3>
                </div>

                <div class="card-body">
                    <dl class="row fs-5">
                        <dt class="col-sm-4 text-muted">ID клієнта:</dt>
                        <dd class="col-sm-8" th:text="${client.id}">5</dd>

                        <dt class="col-sm-4 text-muted">Ім'я:</dt>
                        <dd class="col-sm-8 fw-bold" th:text="${client.name}">Олена Петрівна</dd>

                        <dt class="col-sm-4 text-muted">Email:</dt>
                        <dd class="col-sm-8" th:text="${client.email}">client@mail.com</dd>

                        <dt class="col-sm-4 text-muted">Поточний баланс:</dt>
                        <dd class="col-sm-8 text-success fw-bold" th:text="${client.balance} + ' грн.'">1500.00 грн.</dd>
                    </dl>

                    <hr>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="/clients" class="btn btn-secondary">
                            ← Назад до списку
                        </a>

                        <a th:href="@{/orders/client/{id}(id=${client.id})}" class="btn btn-primary">
                            Історія замовлень клієнта
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
